<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Habit Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const SUPABASE_URL = "https://lsctlfavvxasbkcvbjmq.supabase.co";
const SUPABASE_KEY = "sb_publishable_33maxbMOQrHvDSYwFouYNQ_EWrP1s8K";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ========================================
   Toggle Component
   ======================================== */
const Toggle = ({ value, onChange }) => (
  <button onClick={() => onChange(!value)} className="relative inline-flex items-center">
    <div className={`w-9 h-5 rounded-full transition duration-200 ${value ? "bg-blue-600" : "bg-gray-300"}`}>
      <div className={`w-4 h-4 bg-white rounded-full shadow absolute top-0.5 transition duration-200 ${value ? "translate-x-4" : "translate-x-0.5"}`} />
    </div>
  </button>
);

/* ========================================
   Welcome Page
   ======================================== */
const WelcomePage = ({ logs, setPage }) => {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const loggedDates = new Set(logs.map(log => log.log_date));

  let streak = 0;
  let checkDate = new Date(today);
  while (true) {
    const dateStr = checkDate.toISOString().split('T')[0];
    if (loggedDates.has(dateStr)) {
      streak++;
      checkDate.setDate(checkDate.getDate() - 1);
    } else {
      break;
    }
  }

  return (
    <button
      onClick={() => setPage('log')}
      className="h-screen w-full flex items-center justify-center bg-gradient-to-br from-blue-50 to-purple-50 focus:outline-none"
    >
      <div className="text-center px-6">
        <h1 className="text-3xl font-bold text-gray-900 mb-8">Daily Habit Tracker</h1>
        <div className="bg-white rounded-xl shadow-md p-8 max-w-xs mx-auto">
          <h3 className="text-lg font-medium text-gray-700 mb-3">Current Streak</h3>
          <div className="text-5xl font-bold text-blue-600 mb-1">{streak}</div>
          <div className="text-base text-gray-600">days in a row 🔥</div>
        </div>
        <p className="text-base text-gray-600 mt-8">Tap to log today</p>
      </div>
    </button>
  );
};

/* ========================================
   Log Page
   ======================================== */
const LogPage = ({ logs, setPage, refetchLogs }) => {
  const [usedChatGPT, setUsedChatGPT] = useState(false);
  const [activity, setActivity] = useState({
    cardio: "none",
    tennis: false,
    strengthHome: false,
    strengthGym: false,
    rehab: false,
    mobility: false
  });

  const today = new Date().toISOString().split("T")[0];
  const todayLog = logs.find(l => l.log_date === today);

  useEffect(() => {
    if (todayLog) {
      setUsedChatGPT(todayLog.usedChatGPT ?? false);
      setActivity(todayLog.activity || {
        cardio: "none",
        tennis: false,
        strengthHome: false,
        strengthGym: false,
        rehab: false,
        mobility: false
      });
    } else {
      setUsedChatGPT(false);
      setActivity({
        cardio: "none",
        tennis: false,
        strengthHome: false,
        strengthGym: false,
        rehab: false,
        mobility: false
      });
    }
  }, [todayLog]);

  const hasData = 
    usedChatGPT ||
    activity.cardio !== "none" ||
    activity.tennis || activity.strengthHome || activity.strengthGym ||
    activity.rehab || activity.mobility;

  const handleSubmit = async () => {
    const payload = { 
      user_id: "me", 
      log_date: today, 
      usedChatGPT,
      activity
    };
    const { error } = await supabase.from("daily_logs").upsert(payload, { onConflict: "user_id,log_date" });
    if (error) {
      alert("Error: " + error.message);
    } else {
      alert("✅ Day logged!");
      refetchLogs();
      setPage('stats');
    }
  };

  const dateStr = new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

  return (
    <div className="min-h-screen pb-24">
      <div className="px-5 pt-8 pb-4 text-center">
        <h1 className="text-2xl font-bold text-gray-900">Today</h1>
        <p className="text-base text-gray-600 mt-1">{dateStr}</p>
      </div>

      <div className="px-5 max-w-2xl mx-auto">
        {/* Food Tracking */}
        <h2 className="text-lg font-semibold text-gray-800 mb-4 text-center">Food Tracking</h2>
        <div className="bg-white rounded-xl shadow-sm p-5 mb-8">
          <div className="flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="text-3xl">🤖</div>
              <h3 className="text-base font-medium text-gray-800">Used ChatGPT for Food Tracking</h3>
            </div>
            <Toggle value={usedChatGPT} onChange={setUsedChatGPT} />
          </div>
        </div>

        {/* Fitness Activity */}
        <h2 className="text-lg font-semibold text-gray-800 mb-4 text-center">Fitness</h2>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div className="bg-white rounded-xl shadow-sm p-4 space-y-4">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="text-3xl">🏃</div>
                <span className="text-base font-medium">Cardio</span>
              </div>
              <select 
                value={activity.cardio} 
                onChange={e => setActivity({...activity, cardio: e.target.value})}
                className="px-3 py-1.5 bg-gray-100 rounded text-sm font-medium focus:ring-1 focus:ring-blue-300"
              >
                <option value="none">None</option>
                <option>Run</option>
                <option>Cycle</option>
                <option>Swim</option>
              </select>
            </div>
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="text-3xl">🎾</div>
                <span className="text-base font-medium">Tennis</span>
              </div>
              <Toggle value={activity.tennis} onChange={v => setActivity({...activity, tennis: v})} />
            </div>
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="text-3xl">🏋️</div>
                <span className="text-base font-medium">Strength (Home)</span>
              </div>
              <Toggle value={activity.strengthHome} onChange={v => setActivity({...activity, strengthHome: v})} />
            </div>
          </div>
          
          <div className="bg-white rounded-xl shadow-sm p-4 space-y-4">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="text-3xl">💪</div>
                <span className="text-base font-medium">Strength (Gym)</span>
              </div>
              <Toggle value={activity.strengthGym} onChange={v => setActivity({...activity, strengthGym: v})} />
            </div>
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="text-3xl">🩹</div>
                <span className="text-base font-medium">Rehab</span>
              </div>
              <Toggle value={activity.rehab} onChange={v => setActivity({...activity, rehab: v})} />
            </div>
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="text-3xl">🤸</div>
                <span className="text-base font-medium">Mobility Routine</span>
              </div>
              <Toggle value={activity.mobility} onChange={v => setActivity({...activity, mobility: v})} />
            </div>
          </div>
        </div>
      </div>

      <div className="fixed bottom-4 left-4 right-4">
        <button 
          disabled={!hasData} 
          onClick={handleSubmit}
          className={`w-full py-3 rounded-xl font-medium text-base shadow transition ${hasData ? "bg-blue-600 text-white hover:bg-blue-700" : "bg-gray-300 text-gray-500"}`}
        >
          Complete Day
        </button>
      </div>
    </div>
  );
};

/* ========================================
   Stats Page
   ======================================== */
const StatsPage = ({ logs, setPage }) => {
  const sortedLogs = [...logs].sort((a, b) => b.log_date.localeCompare(a.log_date));

  const calculateStreak = (conditionFn) => {
    let streak = 0;
    for (const log of sortedLogs) {
      if (conditionFn(log)) streak++;
      else break;
    }
    return streak;
  };

  const loggingStreak = sortedLogs.length > 0 && sortedLogs[0].log_date === new Date().toISOString().split('T')[0]
    ? calculateStreak(() => true)
    : 0;

  const mobilityStreak = calculateStreak(log => log.activity?.mobility === true);
  const chatGPTStreak = calculateStreak(log => log.usedChatGPT === true);

  // Last 30 days
  const thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  const recentLogs = sortedLogs.filter(log => new Date(log.log_date) >= thirtyDaysAgo);

  const cardioCount = recentLogs.filter(log => log.activity?.cardio !== "none").length;
  const tennisCount = recentLogs.filter(log => log.activity?.tennis).length;
  const strengthCount = recentLogs.filter(log => log.activity?.strengthHome || log.activity?.strengthGym).length;
  const rehabCount = recentLogs.filter(log => log.activity?.rehab).length;
  const mobilityCount = recentLogs.filter(log => log.activity?.mobility).length;
  const chatGPTCount = recentLogs.filter(log => log.usedChatGPT).length;

  return (
    <div className="min-h-screen pb-20">
      <div className="px-5 pt-8 pb-4 text-center">
        <h1 className="text-3xl font-bold text-gray-900">Your Progress</h1>
        <p className="text-sm text-gray-500 mt-2">Last 30 days</p>
        <button onClick={() => setPage('log')} className="mt-4 text-blue-600 text-base font-medium">← Back to Today</button>
      </div>

      <div className="px-5 max-w-4xl mx-auto space-y-8">
        {/* Streaks */}
        <div className="bg-white rounded-2xl shadow-md p-6">
          <h2 className="text-2xl font-bold text-gray-800 mb-6">Current Streaks 🔥</h2>
          <div className="grid grid-cols-3 gap-6">
            <div className="text-center">
              <div className="text-4xl font-bold text-blue-600">{loggingStreak}</div>
              <p className="text-sm text-gray-600 mt-2">Daily Logging</p>
            </div>
            <div className="text-center">
              <div className="text-4xl font-bold text-teal-600">{mobilityStreak}</div>
              <p className="text-sm text-gray-600 mt-2">Mobility Days 🤸</p>
            </div>
            <div className="text-center">
              <div className="text-4xl font-bold text-purple-600">{chatGPTStreak}</div>
              <p className="text-sm text-gray-600 mt-2">ChatGPT Tracking 🤖</p>
            </div>
          </div>
        </div>

        {/* Fitness Stats */}
        <div className="bg-white rounded-2xl shadow-md p-6">
          <h2 className="text-2xl font-bold text-gray-800 mb-6">Fitness (Last 30 Days)</h2>
          <div className="space-y-4">
            <div className="flex justify-between items-center">
              <span className="text-lg font-medium text-gray-700 flex items-center gap-2">🏃 Cardio</span>
              <span className="text-2xl font-bold text-indigo-600">{cardioCount}</span>
            </div>
            <div className="flex justify-between items-center">
              <span className="text-lg font-medium text-gray-700 flex items-center gap-2">🎾 Tennis</span>
              <span className="text-2xl font-bold text-green-600">{tennisCount}</span>
            </div>
            <div className="flex justify-between items-center">
              <span className="text-lg font-medium text-gray-700 flex items-center gap-2">💪 Strength</span>
              <span className="text-2xl font-bold text-purple-600">{strengthCount}</span>
            </div>
            <div className="flex justify-between items-center">
              <span className="text-lg font-medium text-gray-700 flex items-center gap-2">🩹 Rehab</span>
              <span className="text-2xl font-bold text-orange-600">{rehabCount}</span>
            </div>
            <div className="flex justify-between items-center">
              <span className="text-lg font-medium text-gray-700 flex items-center gap-2">🤸 Mobility</span>
              <span className="text-2xl font-bold text-teal-600">{mobilityCount}</span>
            </div>
          </div>
        </div>

        {/* Food Tracking Stats */}
        <div className="bg-white rounded-2xl shadow-md p-6">
          <h2 className="text-2xl font-bold text-gray-800 mb-6">Food Tracking (Last 30 Days)</h2>
          <div className="text-center">
            <div className="text-5xl font-bold text-blue-600">{chatGPTCount}</div>
            <p className="text-lg text-gray-600 mt-3">days using ChatGPT 🤖</p>
          </div>
        </div>
      </div>
    </div>
  );
};

/* ========================================
   Main App
   ======================================== */
const App = () => {
  const [page, setPage] = useState('welcome');
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);

  const fetchLogs = async () => {
    setLoading(true);
    const { data, error } = await supabase
      .from("daily_logs")
      .select("*")
      .eq("user_id", "me")
      .order("log_date", { ascending: false });

    if (!error && data) {
      setLogs(data);
    }
    setLoading(false);
  };

  useEffect(() => {
    fetchLogs();
  }, []);

  if (loading) {
    return <div className="flex items-center justify-center h-screen text-lg">Loading...</div>;
  }

  return (
    <>
      {page === 'welcome' && <WelcomePage logs={logs} setPage={setPage} />}
      {page === 'log' && <LogPage logs={logs} setPage={setPage} refetchLogs={fetchLogs} />}
      {page === 'stats' && <StatsPage logs={logs} setPage={setPage} />}
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
